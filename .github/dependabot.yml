version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      test-dependencies:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "NSubstitute*"
          - "xunit*"
          - "FluentAssertions"
          - "AwesomeAssertions"
          - "Testcontainers*"
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /MessageQueue
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
