version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      build-tooling:
        patterns:
          - "Microsoft.CodeAnalysis.PublicApiAnalyzers"
          - "Microsoft.SourceLink.*"
      test-dependencies:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "NSubstitute*"
          - "xunit*"
          - "AwesomeAssertions"
          - "Testcontainers*"
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]

  # The Testcontainers image for the integration tests and benchmarks (read from this Dockerfile at run time).
  - package-ecosystem: docker
    directory: /docker/test-broker
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]

  # The Testcontainers images for the Azure Service Bus emulator tests (read from this Dockerfile at run time).
  - package-ecosystem: docker
    directory: /docker/test-servicebus
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
