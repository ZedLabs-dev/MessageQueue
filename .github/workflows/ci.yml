name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml runs the same gates before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore ESE.MessageQueue.sln --locked-mode

      - name: Build
        run: dotnet build ESE.MessageQueue.sln --no-restore --configuration Release -warnaserror

      - name: Verify formatting
        run: dotnet format ESE.MessageQueue.sln --no-restore --verify-no-changes --verbosity diagnostic

      - name: Restore local tools
        run: dotnet tool restore

      - name: Unit tests
        run: >
          dotnet test ESE.MessageQueue.sln --no-build --configuration Release
          --filter Category=Unit
          --collect:"XPlat Code Coverage"
          --blame-hang-timeout 2m
          --results-directory TestResults
          --logger "trx;LogFileName=unit.trx"

      # RabbitMQ runs in a Testcontainers container (Docker is preinstalled on ubuntu runners).
      # MQ_REQUIRE_DOCKER turns "Docker unavailable" into a failure instead of a skip.
      # Azure Service Bus tests skip unless the MQ_ASB_CONNECTION_STRING secret is configured.
      - name: Integration tests
        env:
          MQ_REQUIRE_DOCKER: 'true'
          MQ_ASB_CONNECTION_STRING: ${{ secrets.MQ_ASB_CONNECTION_STRING }}
        run: >
          dotnet test ESE.MessageQueue.sln --no-build --configuration Release
          --filter Category=Integration
          --collect:"XPlat Code Coverage"
          --blame-hang-timeout 2m
          --results-directory TestResults
          --logger "trx;LogFileName=integration.trx"

      - name: Coverage gate
        run: |
          bash scripts/coverage.sh --skip-tests
          cat TestResults/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Vulnerable package scan
        if: always()
        shell: bash  # bash -eo pipefail: a failing `dotnet list` fails the step despite the pipe to tee
        run: |
          dotnet list ESE.MessageQueue.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q '^ *>' vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      # The three packages (ADR 0005): metadata, SourceLink, symbols and package validation; the provider packages pin
      # the exact core version (ADR 0015). Not --no-build: pack rebuilds without the tests' InternalsVisibleTo (ADR 0016).
      - name: Pack
        run: dotnet pack ESE.MessageQueue.sln --no-restore --configuration Release --output artifacts

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-and-coverage
          path: TestResults/
          if-no-files-found: warn

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error
