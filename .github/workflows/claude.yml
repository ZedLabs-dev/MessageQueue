name: Claude

# Optional (ADR 0017). Claude Code answers @claude from the repository's owner, members and collaborators, and reviews
# their pull requests when opened or marked ready (later pushes are re-reviewed on request with an @claude comment).
# Needs the ANTHROPIC_API_KEY secret; without it every job is skipped. Never runs for Dependabot or for pull requests
# from forks, and never gives build or test tools to code from a fork. The owner works on main, so pull requests are
# the review vehicle for unattended changes (weekly package updates, @claude work).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read

jobs:
  # Secrets cannot appear in a job-level `if`, so a tiny job reports whether the key exists.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.key.outputs.enabled }}
    steps:
      - id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: echo "enabled=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  mention:
    needs: gate
    if: >-
      needs.gate.outputs.enabled == 'true' && github.actor != 'dependabot[bot]' && (
        (github.event_name == 'issue_comment'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
          && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read   # lets Claude read CI results on the pull request
    steps:
      # An @claude comment on a pull request names no head repository in the event; ask the API whether it is a fork.
      - name: Is this a pull request from a fork?
        id: fork
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.pull_request && github.event.issue.number || github.event.pull_request.number || '' }}
        run: |
          fork=false
          if [ -n "$PR" ]; then
            fork="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)"
          fi
          echo "fork=$fork" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.fork.outputs.fork != 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        if: steps.fork.outputs.fork != 'true'
        with:
          global-json-file: global.json

      # CLAUDE.md is the contract: spec first, the build and unit tests green, PublicAPI files updated.
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        if: steps.fork.outputs.fork != 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format:*),Bash(dotnet restore:*),Bash(dotnet list:*),Bash(dotnet pack:*),Bash(scripts/coverage.sh:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"

  review:
    needs: gate
    if: >-
      needs.gate.outputs.enabled == 'true'
      && github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # The /code-review and /security-review passes of OPTIMIZATION-PLAN section 6.4, read-only (no build tools).
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Run /code-review on this pull request, then /security-review, against CLAUDE.md and the checklist in
            OPTIMIZATION-PLAN.md section 2. Report only real problems, most severe first: correctness (retry,
            settlement, shutdown, concurrency), security (secrets or exception text in messages, logs, spans or health
            results; unsafe deserialization; TLS), public API changes missing from PublicAPI.Unshipped.txt or the
            CHANGELOG, tests that pass vacuously or lack a "because" starting "it should", and packages outside Central
            Package Management. Use inline comments for line-specific issues and one summary comment.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
